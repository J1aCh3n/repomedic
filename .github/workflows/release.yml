name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ""
      REPOMEDIC_OPENAI_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
          python -m pip install -e . build==1.6.0

      - name: Run deterministic release checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q repomedic tests scripts
          python -m pip check

      - name: Build release artifacts
        run: python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
