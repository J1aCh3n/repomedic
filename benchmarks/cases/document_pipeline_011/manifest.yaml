case_id: document_pipeline_011
category: edge_case_regression_bug
fixture:
  id: document_pipeline
  version: document_pipeline-v1
issue: >-
  `process` truncates or creates the destination before it knows that loading
  and transformation will succeed. Make failed conversions leave an existing
  destination byte-for-byte unchanged and leave a previously missing
  destination absent, while preserving successful export behavior.
runnable_entry_point:
  argv: [python, -m, document_pipeline.cli]
  cwd: repo
tests:
  public:
    argv: [python, -m, unittest, discover, -s, tests, -v]
    cwd: repo
  evaluator:
    argv: [python, -m, unittest, discover, -s, hidden_tests, -v]
    cwd: evaluator
paths:
  allowed:
    - document_pipeline/pipeline.py
  forbidden:
    - .git
    - .env
    - tests
    - evaluator
limits:
  wall_time_seconds: 60
  tool_calls: 43
  repair_iterations: 2
expected_behavior:
  - A failed conversion does not change an existing destination.
  - A failed conversion does not create a missing destination.
  - A successful conversion still writes and returns the rendered Markdown.
