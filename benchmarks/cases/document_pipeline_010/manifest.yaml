case_id: document_pipeline_010
category: cross_module_contract_bug
fixture:
  id: document_pipeline
  version: document_pipeline-v1
issue: >-
  Loader is returning a string in `Document.source`, but the model and Exporter
  contract require a `pathlib.Path`. Restore that cross-module contract so
  loaded documents retain the original Path and Markdown rendering includes
  only its file name.
runnable_entry_point:
  argv: [python, -m, document_pipeline.cli]
  cwd: repo
tests:
  public:
    argv: [python, -m, unittest, discover, -s, tests, -v]
    cwd: repo
  evaluator:
    argv: [python, -m, unittest, discover, -s, hidden_tests, -v]
    cwd: evaluator
expected_behavior:
  - "`load_document` preserves its Path argument as `Document.source`."
  - Exported Markdown contains the source file name, not its parent directories.
  - Existing loading, transformation, and export behavior remains unchanged.
