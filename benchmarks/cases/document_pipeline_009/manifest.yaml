case_id: document_pipeline_009
category: local_logic_bug
fixture:
  id: document_pipeline
  version: document_pipeline-v1
issue: >-
  Whitespace normalization only handles literal spaces, so tabs, newlines, and
  other whitespace runs leak into exported documents. Collapse every run of
  whitespace to one ordinary space and trim both ends without changing any
  non-whitespace characters.
runnable_entry_point:
  argv: [python, -m, document_pipeline.cli]
  cwd: repo
tests:
  public:
    argv: [python, -m, unittest, discover, -s, tests, -v]
    cwd: repo
  evaluator:
    argv: [python, -m, unittest, discover, -s, hidden_tests, -v]
    cwd: evaluator
paths:
  allowed:
    - document_pipeline/transform.py
  forbidden:
    - .git
    - .env
    - tests
    - evaluator
limits:
  wall_time_seconds: 60
  tool_calls: 43
  repair_iterations: 2
expected_behavior:
  - Leading and trailing whitespace is removed.
  - Mixed whitespace runs become one ordinary space.
  - Non-whitespace characters retain their original order and case.
