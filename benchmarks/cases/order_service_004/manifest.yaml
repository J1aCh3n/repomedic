case_id: order_service_004
category: small_feature
fixture:
  id: order_service
  version: order_service-v1
issue: >-
  Add `OrderService.cancel_order(order_id)`. A successful cancellation must
  return the cancelled order, restore its reserved inventory, remove it from
  storage, and never reuse its order ID. Cancelling an unknown or already
  cancelled order must raise `ValueError` without changing inventory.
runnable_entry_point:
  argv: [python, -m, order_service.app]
  cwd: repo
tests:
  public:
    argv: [python, -m, unittest, discover, -s, tests, -v]
    cwd: repo
  evaluator:
    argv: [python, -m, unittest, discover, -s, hidden_tests, -v]
    cwd: evaluator
paths:
  allowed:
    - order_service/inventory.py
    - order_service/service.py
    - order_service/storage.py
  forbidden:
    - .git
    - .env
    - tests
    - evaluator
limits:
  wall_time_seconds: 60
  tool_calls: 43
  repair_iterations: 2
expected_behavior:
  - Cancelling a stored order returns it and removes it from storage.
  - Cancellation restores exactly the quantity reserved by that order.
  - Unknown and repeated cancellations raise `ValueError` without side effects.
  - Order IDs remain unique and increasing after a cancellation.
