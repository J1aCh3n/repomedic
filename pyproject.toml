[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomedic"
version = "0.1.0"
description = "A deterministic harness for auditable repository repair experiments"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
repomedic = "repomedic.__main__:main"

[tool.setuptools.packages.find]
include = ["repomedic*"]
